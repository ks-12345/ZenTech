<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="320" height="240" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="waterGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#eaf6fb"/>
      <stop offset="100%" stop-color="#cfe9f2"/>
    </radialGradient>
    <linearGradient id="petalOuter" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#e6a3c9"/>
      <stop offset="100%" stop-color="#f7d6ea"/>
    </linearGradient>
    <linearGradient id="petalInner" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#d97fb0"/>
      <stop offset="100%" stop-color="#f6c6e0"/>
    </linearGradient>
    <radialGradient id="center" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#ffe37a"/>
      <stop offset="100%" stop-color="#f5b942"/>
    </radialGradient>
  </defs>

  <!-- water background -->
  <ellipse cx="200" cy="250" rx="190" ry="35" fill="url(#waterGrad)"/>

  <!-- ripples -->
  <ellipse cx="200" cy="250" rx="150" ry="24" fill="none" stroke="#bfe0ec" stroke-width="2" opacity="0.6">
    <animate attributeName="rx" values="150;170;150" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="4s" repeatCount="indefinite"/>
  </ellipse>

  <!-- lily pads -->
  <path d="M60,255 Q75,235 100,250 Q85,265 60,255 Z" fill="#7bb97e"/>
  <path d="M320,260 Q335,242 355,255 Q340,270 320,260 Z" fill="#6fae74"/>

  <!-- stem -->
  <path d="M200,220 Q195,190 200,165" stroke="#5a9e63" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- flower group, gentle sway -->
  <g transform-origin="200 160">
    <animateTransform attributeName="transform" type="rotate"
      values="-2 200 200; 2 200 200; -2 200 200" dur="6s" repeatCount="indefinite" additive="sum"/>

    <!-- outer petals -->
    <g id="outerPetals">
      <!-- 8 outer petals rotated around center, each with subtle independent sway -->
      <g transform="rotate(0 200 160)">
        <path d="M200,160 C185,120 185,70 200,45 C215,70 215,120 200,160 Z" fill="url(#petalOuter)" stroke="#d98cb8" stroke-width="1">
          <animateTransform attributeName="transform" type="rotate" values="-3 200 160;3 200 160;-3 200 160" dur="3.2s" repeatCount="indefinite"/>
        </path>
      </g>
      <g transform="rotate(45 200 160)">
        <path d="M200,160 C185,120 185,70 200,45 C215,70 215,120 200,160 Z" fill="url(#petalOuter)" stroke="#d98cb8" stroke-width="1">
          <animateTransform attributeName="transform" type="rotate" values="-3 200 160;3 200 160;-3 200 160" dur="3.5s" repeatCount="indefinite" begin="0.2s"/>
        </path>
      </g>
      <g transform="rotate(90 200 160)">
        <path d="M200,160 C185,120 185,70 200,45 C215,70 215,120 200,160 Z" fill="url(#petalOuter)" stroke="#d98cb8" stroke-width="1">
          <animateTransform attributeName="transform" type="rotate" values="-3 200 160;3 200 160;-3 200 160" dur="3.3s" repeatCount="indefinite" begin="0.4s"/>
        </path>
      </g>
      <g transform="rotate(135 200 160)">
        <path d="M200,160 C185,120 185,70 200,45 C215,70 215,120 200,160 Z" fill="url(#petalOuter)" stroke="#d98cb8" stroke-width="1">
          <animateTransform attributeName="transform" type="rotate" values="-3 200 160;3 200 160;-3 200 160" dur="3.6s" repeatCount="indefinite" begin="0.6s"/>
        </path>
      </g>
      <g transform="rotate(180 200 160)">
        <path d="M200,160 C185,120 185,70 200,45 C215,70 215,120 200,160 Z" fill="url(#petalOuter)" stroke="#d98cb8" stroke-width="1">
          <animateTransform attributeName="transform" type="rotate" values="-3 200 160;3 200 160;-3 200 160" dur="3.1s" repeatCount="indefinite" begin="0.1s"/>
        </path>
      </g>
      <g transform="rotate(225 200 160)">
        <path d="M200,160 C185,120 185,70 200,45 C215,70 215,120 200,160 Z" fill="url(#petalOuter)" stroke="#d98cb8" stroke-width="1">
          <animateTransform attributeName="transform" type="rotate" values="-3 200 160;3 200 160;-3 200 160" dur="3.4s" repeatCount="indefinite" begin="0.3s"/>
        </path>
      </g>
      <g transform="rotate(270 200 160)">
        <path d="M200,160 C185,120 185,70 200,45 C215,70 215,120 200,160 Z" fill="url(#petalOuter)" stroke="#d98cb8" stroke-width="1">
          <animateTransform attributeName="transform" type="rotate" values="-3 200 160;3 200 160;-3 200 160" dur="3.7s" repeatCount="indefinite" begin="0.5s"/>
        </path>
      </g>
      <g transform="rotate(315 200 160)">
        <path d="M200,160 C185,120 185,70 200,45 C215,70 215,120 200,160 Z" fill="url(#petalOuter)" stroke="#d98cb8" stroke-width="1">
          <animateTransform attributeName="transform" type="rotate" values="-3 200 160;3 200 160;-3 200 160" dur="3.0s" repeatCount="indefinite" begin="0.7s"/>
        </path>
      </g>
    </g>

    <!-- inner petals, slightly smaller, breathing scale -->
    <g id="innerPetals">
      <g transform="rotate(22 200 160)">
        <path d="M200,160 C190,130 190,95 200,75 C210,95 210,130 200,160 Z" fill="url(#petalInner)">
          <animateTransform attributeName="transform" type="scale" values="1 1;1.04 1.04;1 1" dur="2.5s" repeatCount="indefinite"/>
        </path>
      </g>
      <g transform="rotate(90 200 160)">
        <path d="M200,160 C190,130 190,95 200,75 C210,95 210,130 200,160 Z" fill="url(#petalInner)">
          <animateTransform attributeName="transform" type="scale" values="1 1;1.04 1.04;1 1" dur="2.7s" repeatCount="indefinite" begin="0.3s"/>
        </path>
      </g>
      <g transform="rotate(158 200 160)">
        <path d="M200,160 C190,130 190,95 200,75 C210,95 210,130 200,160 Z" fill="url(#petalInner)">
          <animateTransform attributeName="transform" type="scale" values="1 1;1.04 1.04;1 1" dur="2.4s" repeatCount="indefinite" begin="0.6s"/>
        </path>
      </g>
      <g transform="rotate(226 200 160)">
        <path d="M200,160 C190,130 190,95 200,75 C210,95 210,130 200,160 Z" fill="url(#petalInner)">
          <animateTransform attributeName="transform" type="scale" values="1 1;1.04 1.04;1 1" dur="2.6s" repeatCount="indefinite" begin="0.9s"/>
        </path>
      </g>
      <g transform="rotate(294 200 160)">
        <path d="M200,160 C190,130 190,95 200,75 C210,95 210,130 200,160 Z" fill="url(#petalInner)">
          <animateTransform attributeName="transform" type="scale" values="1 1;1.04 1.04;1 1" dur="2.8s" repeatCount="indefinite" begin="1.1s"/>
        </path>
      </g>
    </g>

    <!-- center -->
    <circle cx="200" cy="150" r="14" fill="url(#center)">
      <animate attributeName="r" values="14;15.5;14" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
